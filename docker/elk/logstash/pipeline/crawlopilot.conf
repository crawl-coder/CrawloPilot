input {
  # TCP input for application logs
  tcp {
    port => 5000
    codec => json_lines
    tags => ["application"]
  }
  
  # UDP input for high-throughput logging
  udp {
    port => 5000
    codec => json_lines
    tags => ["application"]
  }
  
  # Beats input for Filebeat
  beats {
    port => 5044
    tags => ["docker"]
  }
}

filter {
  # Parse JSON logs from application
  if "application" in [tags] {
    json {
      source => "message"
      target => "parsed"
    }
    
    # Add timestamp
    date {
      match => ["timestamp", "ISO8601", "UNIX", "UNIX_MS"]
      target => "@timestamp"
    }
    
    # Add log level
    if [parsed][level] {
      mutate {
        add_field => { "log_level" => "%{[parsed][level]}" }
      }
    }
    
    # Add logger name
    if [parsed][name] {
      mutate {
        add_field => { "logger" => "%{[parsed][name]}" }
      }
    }
    
    # Add trace ID for distributed tracing
    if [parsed][trace_id] {
      mutate {
        add_field => { "trace_id" => "%{[parsed][trace_id]}" }
      }
    }
  }
  
  # Docker container logs
  if "docker" in [tags] {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{WORD:level} %{GREEDYDATA:log_message}" }
    }
    
    # Extract container name
    if [container][name] {
      mutate {
        add_field => { "container_name" => "%{[container][name]}" }
      }
    }
  }
  
  # Add geoip for IP addresses
  if [parsed][client_ip] {
    geoip {
      source => "[parsed][client_ip]"
      target => "geoip"
    }
  }
}

output {
  # Elasticsearch output
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "crawlopilot-%{[tags][0]}-%{+YYYY.MM.dd}"
  }
  
  # Debug output (uncomment for troubleshooting)
  # stdout {
  #   codec => rubydebug
  # }
}
