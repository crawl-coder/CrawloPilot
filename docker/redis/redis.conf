# Redis 配置文件

# 绑定地址
bind 0.0.0.0

# 端口
port 6379

# 保护模式
protected-mode no

# 日志级别
loglevel notice

# 持久化配置
save 900 1
save 300 10
save 60 10000

# 最大内存
maxmemory 256mb

# 内存淘汰策略
maxmemory-policy allkeys-lru

# 启用 AOF
appendonly yes
appendfilename "appendonly.aof"

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128
